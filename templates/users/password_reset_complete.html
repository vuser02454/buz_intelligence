{% extends "users/base_auth.html" %}
{% load static %}

{% block title %}Password Reset Complete - Crowd Heatmap{% endblock %}

{% block auth_content %}
<style>
    .icon-badge-success {
        width: 72px;
        height: 72px;
        background: rgba(102, 252, 241, 0.1);
        border: 1px solid rgba(102, 252, 241, 0.3);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        margin-bottom: 1.5rem;
        box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
    }

    .btn-login {
        background: linear-gradient(90deg, #45a29e, #66fcf1);
        color: #0b0c10;
        border: none;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.8rem;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .btn-login:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px -10px rgba(102, 252, 241, 0.6);
        color: #000;
    }
</style>

<div class="card border-0">
    <div class="card-body p-4 p-md-5 text-center">
        <div class="icon-badge-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>

        <h2 class="mb-2 fw-bold">Password Reset Complete</h2>
        <p class="text-muted mb-4 fs-6">
            Your password has been reset successfully. You can now log in with your new password.
        </p>

        <div class="d-grid gap-2">
            <a href="{% url 'login' %}" class="btn btn-login btn-lg shadow-sm">
                Log In
            </a>
        </div>
    </div>
</div>
{% endblock %}
