{% extends "users/base_auth.html" %}
{% load static %}

{% block title %}Authenticating - Crowd Heatmap{% endblock %}

{% block auth_content %}
<div class="card border-0">
    <div class="card-body p-4 p-md-5 text-center">
        <div class="spinner-border text-info mb-4" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
        <h3 class="fw-bold mb-2 text-white" id="callbackHeading">Verifying Account...</h3>
        <p class="text-muted mb-4 fs-6" id="callbackMessage">
            Please wait while we confirm your email and establish your secure identity.
        </p>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="actionBtnWrapper" class="d-none mt-3">
            <a href="{% url 'login' %}" class="btn btn-login w-100">Go to Log In</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function () {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash || window.location.search);
    
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    const type = params.get('type') || '';
    const errorDescription = params.get('error_description');

    const heading = document.getElementById('callbackHeading');
    const message = document.getElementById('callbackMessage');
    const errorAlert = document.getElementById('errorAlert');
    const actionBtn = document.getElementById('actionBtnWrapper');

    if (errorDescription) {
        heading.innerText = 'Verification Failed';
        message.innerText = decodeURIComponent(errorDescription);
        errorAlert.classList.remove('d-none');
        errorAlert.innerText = decodeURIComponent(errorDescription);
        actionBtn.classList.remove('d-none');
        return;
    }

    if (type === 'recovery' && accessToken) {
        // Redirect to password reset confirmation page with token
        heading.innerText = 'Redirecting to Password Reset...';
        window.location.href = `{% url 'password_reset_confirm_direct' %}#access_token=${accessToken}`;
        return;
    }

    if (accessToken) {
        try {
            heading.innerText = 'Email Verified Successfully!';
            message.innerText = 'Linking your verified profile to your dashboard...';

            // Sync with Django backend
            const csrfToken = getCookie('csrftoken');
            const response = await fetch('{% url "auth_sync_session_api" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({
                    access_token: accessToken,
                    event_type: 'EMAIL_VERIFIED'
                })
            });

            const result = await response.json();
            if (result.success) {
                heading.innerText = 'Account Verified!';
                message.innerText = 'Your email is confirmed. Redirecting to login...';
                setTimeout(() => {
                    window.location.href = '{% url "login" %}?verified=true';
                }, 1200);
            } else {
                heading.innerText = 'Account Verified';
                message.innerText = 'Your email has been verified. You can now log in.';
                setTimeout(() => {
                    window.location.href = '{% url "login" %}?verified=true';
                }, 1500);
            }
        } catch (err) {
            console.error('Error syncing auth session:', err);
            window.location.href = '{% url "login" %}?verified=true';
        }
    } else {
        // Fallback: If no token in URL, redirect to login
        setTimeout(() => {
            window.location.href = '{% url "login" %}';
        }, 1000);
    }
});

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
